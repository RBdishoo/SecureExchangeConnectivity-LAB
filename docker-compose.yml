# Secure Exchange Connectivity Lab — Week 1–2 foundation
# Synthetic / educational only. No real market data or credentials.

x-jwt-secret: &jwt-secret changeme-lab-only-jwt-secret

services:
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: secx-gateway
    ports:
      - "8080:8000"
    networks:
      - edge-net
      - app-net
      - security-net
    environment:
      SERVICE_NAME: gateway
      IDENTITY_URL: http://identity:8001
      MATCHING_URL: http://matching-engine:8002
      JWT_SECRET: *jwt-secret
      JWT_EXPIRE_MINUTES: "30"
      ORDER_RATE_LIMIT: "5"
      ORDER_RATE_WINDOW_SECONDS: "60"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      identity:
        condition: service_healthy
      matching-engine:
        condition: service_healthy

  identity:
    build:
      context: .
      dockerfile: services/identity/Dockerfile
    container_name: secx-identity
    networks:
      - app-net
    environment:
      SERVICE_NAME: identity
      JWT_SECRET: *jwt-secret
      JWT_EXPIRE_MINUTES: "30"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  matching-engine:
    build:
      context: .
      dockerfile: services/matching-engine/Dockerfile
    container_name: secx-matching-engine
    networks:
      - app-net
      - data-net
    environment:
      SERVICE_NAME: matching-engine
      DATABASE_URL: postgresql://labuser:postgres-lab-password@postgres:5432/seclab
      JWT_SECRET: *jwt-secret
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

  market-data:
    build:
      context: .
      dockerfile: services/market-data/Dockerfile
    container_name: secx-market-data
    networks:
      - app-net
    environment:
      SERVICE_NAME: market-data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  alerting:
    build:
      context: .
      dockerfile: services/alerting/Dockerfile
    container_name: secx-alerting
    networks:
      - security-net
    environment:
      SERVICE_NAME: alerting
      RULES_DIR: /app/detections
      ALERTS_DIR: /data/alerts
      LOGS_PATH: /data/logs/synthetic-events.jsonl
    volumes:
      - lab_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  postgres:
    image: postgres:16-alpine
    container_name: secx-postgres
    networks:
      - data-net
    environment:
      POSTGRES_USER: labuser
      POSTGRES_PASSWORD: postgres-lab-password
      POSTGRES_DB: seclab
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labuser -d seclab"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    # Intentionally NOT published to the host — data-net only.

  postgres-dr:
    profiles: ["dr"]
    image: postgres:16-alpine
    container_name: secx-postgres-dr
    networks:
      - data-net
    environment:
      POSTGRES_USER: labuser
      POSTGRES_PASSWORD: postgres-lab-password
      POSTGRES_DB: seclab
    volumes:
      - postgres_dr_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labuser -d seclab"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    # DR instance — started only with: docker compose --profile dr up -d postgres-dr

networks:
  edge-net:
    driver: bridge
    name: secx-edge-net
  app-net:
    driver: bridge
    name: secx-app-net
  data-net:
    driver: bridge
    name: secx-data-net
    internal: true
  security-net:
    driver: bridge
    name: secx-security-net

volumes:
  postgres_data:
  postgres_dr_data:
  lab_data:
